<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="theme-color" content="#0f172a" />
        <title>HEIC to JPG Converter</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <!-- WebAssembly HEIC decoder and JSZip libraries -->
        <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

        <style>
            :root {
                --primary: #38bdf8;
                --primary-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
                --success: #34d399;
                --success-gradient: linear-gradient(135deg, #34d399, #059669);
                --danger: #f87171;
                --bg-app: #0f172a;
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --card-hover: rgba(51, 65, 85, 0.8);
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --safe-top: env(safe-area-inset-top, 0px);
                --safe-bottom: env(safe-area-inset-bottom, 0px);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            body {
                font-family:
                    "Plus Jakarta Sans",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #020617;
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow-x: hidden;
                user-select: none;
            }

            /* Ambient background glow for desktop showcase */
            .ambient-glow {
                position: fixed;
                width: 500px;
                height: 500px;
                border-radius: 50%;
                filter: blur(120px);
                opacity: 0.18;
                pointer-events: none;
                z-index: 0;
            }
            .glow-1 {
                background: #38bdf8;
                top: -100px;
                left: 30%;
            }
            .glow-2 {
                background: #818cf8;
                bottom: -100px;
                right: 30%;
            }

            /* Mobile-App Device Shell (Fixed-Width Frame) */
            .app-container {
                position: relative;
                z-index: 1;
                width: 100%;
                max-width: 420px;
                height: 100vh;
                max-height: 890px;
                background: var(--bg-app);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                box-shadow:
                    0 25px 60px -15px rgba(0, 0, 0, 0.7),
                    0 0 0 1px rgba(255, 255, 255, 0.1);
            }

            @media (min-width: 440px) {
                .app-container {
                    border-radius: 44px;
                    height: 92vh;
                    margin: 1.5rem auto;
                }
            }

            /* iOS Dynamic Island / Status Bar */
            .status-bar {
                height: calc(34px + var(--safe-top));
                padding: var(--safe-top) 1.5rem 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-muted);
                flex-shrink: 0;
                z-index: 20;
            }

            .dynamic-island {
                width: 100px;
                height: 24px;
                background: #000;
                border-radius: 20px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            }

            .status-icons {
                display: flex;
                gap: 0.35rem;
                font-size: 0.7rem;
            }

            /* App Header */
            .app-header {
                padding: 0.8rem 1.25rem 0.6rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
            }

            .app-brand {
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }

            .app-logo {
                width: 36px;
                height: 36px;
                background: var(--primary-gradient);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.15rem;
                box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            }

            .app-title-group h1 {
                font-size: 1.1rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            .app-title-group p {
                font-size: 0.72rem;
                color: var(--success);
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 0.25rem;
            }

            .btn-clear {
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--card-border);
                color: var(--text-muted);
                padding: 0.4rem 0.75rem;
                border-radius: 20px;
                font-size: 0.75rem;
                font-weight: 600;
                cursor: pointer;
                display: none;
                transition: all 0.2s;
            }

            .btn-clear:hover {
                background: rgba(248, 113, 113, 0.15);
                color: var(--danger);
                border-color: rgba(248, 113, 113, 0.3);
            }

            /* Main Scrollable Content */
            .app-content {
                flex: 1;
                overflow-y: auto;
                padding: 0.75rem 1.25rem 6rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                scrollbar-width: none;
            }
            .app-content::-webkit-scrollbar {
                display: none;
            }

            /* Upload / Drop Area */
            .drop-card {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                border: 2px dashed var(--card-border);
                border-radius: 24px;
                padding: 1.6rem 1.25rem;
                text-align: center;
                cursor: pointer;
                position: relative;
                transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .drop-card:hover,
            .drop-card.dragover {
                border-color: var(--primary);
                background: rgba(56, 189, 248, 0.08);
                transform: translateY(-2px);
            }

            .drop-card.has-files {
                border-color: rgba(52, 211, 153, 0.4);
                background: rgba(52, 211, 153, 0.06);
                padding: 1.2rem;
            }

            .drop-card input[type="file"] {
                position: absolute;
                inset: 0;
                opacity: 0;
                cursor: pointer;
                width: 100%;
                height: 100%;
            }

            .drop-icon {
                font-size: 2.2rem;
                margin-bottom: 0.4rem;
                display: inline-block;
                transition: transform 0.2s;
            }

            .drop-card:hover .drop-icon {
                transform: scale(1.1);
            }

            .drop-title {
                font-size: 0.95rem;
                font-weight: 700;
                margin-bottom: 0.2rem;
            }

            .drop-subtitle {
                font-size: 0.75rem;
                color: var(--text-muted);
            }

            /* Settings iOS Section */
            .settings-card {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                border: 1px solid var(--card-border);
                border-radius: 20px;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                gap: 0.85rem;
            }

            .settings-header {
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-muted);
            }

            /* iOS Segmented Control */
            .segmented-control {
                background: rgba(15, 23, 42, 0.8);
                border-radius: 12px;
                padding: 3px;
                display: flex;
                border: 1px solid var(--card-border);
            }

            .segment-btn {
                flex: 1;
                background: transparent;
                border: none;
                color: var(--text-muted);
                padding: 0.45rem 0.2rem;
                font-size: 0.78rem;
                font-weight: 600;
                border-radius: 9px;
                cursor: pointer;
                transition: all 0.2s;
                font-family: inherit;
            }

            .segment-btn.active {
                background: var(--primary-gradient);
                color: #fff;
                box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
            }

            /* Range Slider */
            .slider-group {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .slider-group input[type="range"] {
                flex: 1;
                -webkit-appearance: none;
                appearance: none;
                height: 5px;
                border-radius: 3px;
                background: rgba(255, 255, 255, 0.1);
                outline: none;
            }

            .slider-group input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--primary);
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(56, 189, 248, 0.5);
            }

            .quality-badge {
                font-size: 0.8rem;
                font-weight: 700;
                min-width: 2.4rem;
                text-align: right;
                color: var(--primary);
            }

            /* iOS Toggle Switch */
            .toggle-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding-top: 0.3rem;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
            }

            .toggle-label {
                font-size: 0.82rem;
                font-weight: 600;
            }

            .toggle-sub {
                font-size: 0.7rem;
                color: var(--text-muted);
            }

            .switch {
                position: relative;
                width: 44px;
                height: 24px;
            }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .slider-switch {
                position: absolute;
                cursor: pointer;
                inset: 0;
                background: rgba(255, 255, 255, 0.15);
                transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
                border-radius: 24px;
            }

            .slider-switch:before {
                position: absolute;
                content: "";
                height: 18px;
                width: 18px;
                left: 3px;
                bottom: 3px;
                background-color: white;
                transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
                border-radius: 50%;
            }

            input:checked + .slider-switch {
                background: var(--primary);
            }

            input:checked + .slider-switch:before {
                transform: translateX(20px);
            }

            /* Queue Card List */
            .queue-container {
                display: flex;
                flex-direction: column;
                gap: 0.6rem;
            }

            .queue-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 0.75rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-muted);
            }

            .queue-item {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                border: 1px solid var(--card-border);
                border-radius: 16px;
                padding: 0.75rem 0.9rem;
                display: flex;
                align-items: center;
                gap: 0.75rem;
                transition: all 0.2s;
                animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            @keyframes popIn {
                from {
                    opacity: 0;
                    transform: translateY(8px) scale(0.97);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .item-thumb {
                width: 42px;
                height: 42px;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.2rem;
                flex-shrink: 0;
                overflow: hidden;
            }

            .item-thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .item-info {
                flex: 1;
                min-width: 0;
            }

            .item-name {
                font-size: 0.82rem;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .item-size {
                font-size: 0.7rem;
                color: var(--text-muted);
                margin-top: 0.1rem;
            }

            .item-action {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                flex-shrink: 0;
            }

            .btn-item-dl {
                background: rgba(56, 189, 248, 0.15);
                border: 1px solid rgba(56, 189, 248, 0.3);
                color: var(--primary);
                font-size: 0.72rem;
                font-weight: 700;
                padding: 0.35rem 0.6rem;
                border-radius: 12px;
                cursor: pointer;
                display: none;
                text-decoration: none;
                transition: all 0.2s;
            }

            .btn-item-dl:hover {
                background: var(--primary);
                color: #fff;
            }

            .btn-remove {
                background: transparent;
                border: none;
                color: var(--text-muted);
                font-size: 1rem;
                cursor: pointer;
                padding: 0.2rem 0.4rem;
                border-radius: 8px;
                transition: color 0.2s;
            }

            .btn-remove:hover {
                color: var(--danger);
            }

            /* Badge status */
            .status-badge {
                font-size: 0.68rem;
                font-weight: 700;
                padding: 0.2rem 0.5rem;
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.06);
                color: var(--text-muted);
            }
            .status-badge.converting {
                background: rgba(56, 189, 248, 0.15);
                color: var(--primary);
            }
            .status-badge.done {
                background: rgba(52, 211, 153, 0.15);
                color: var(--success);
            }
            .status-badge.error {
                background: rgba(248, 113, 113, 0.15);
                color: var(--danger);
            }

            /* Sticky Bottom Action Bar */
            .app-bottom-bar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(15, 23, 42, 0.88);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border-top: 1px solid var(--card-border);
                padding: 0.9rem 1.25rem calc(0.9rem + var(--safe-bottom));
                z-index: 30;
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }

            .btn-main {
                width: 100%;
                padding: 0.95rem;
                border: none;
                border-radius: 18px;
                background: var(--primary-gradient);
                color: #0f172a;
                font-size: 0.92rem;
                font-weight: 800;
                letter-spacing: -0.01em;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                box-shadow: 0 8px 24px -4px rgba(56, 189, 248, 0.4);
                transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
                font-family: inherit;
            }

            .btn-main:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 12px 30px -4px rgba(56, 189, 248, 0.5);
            }

            .btn-main:active:not(:disabled) {
                transform: scale(0.98);
            }

            .btn-main:disabled {
                opacity: 0.4;
                cursor: not-allowed;
                box-shadow: none;
                filter: grayscale(0.5);
            }

            .btn-main.success-state {
                background: var(--success-gradient);
                color: #fff;
                box-shadow: 0 8px 24px -4px rgba(52, 211, 153, 0.4);
            }

            /* Micro progress bar */
            .progress-bar-container {
                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                overflow: hidden;
                display: none;
            }

            .progress-bar-fill {
                height: 100%;
                width: 0%;
                background: var(--primary);
                transition: width 0.2s ease-out;
            }

            /* Spinners */
            .spinner-mini {
                width: 14px;
                height: 14px;
                border: 2px solid rgba(56, 189, 248, 0.3);
                border-top-color: var(--primary);
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
                display: inline-block;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <div class="app-container">
            <!-- iOS Status Bar & Notch -->
            <div class="status-bar">
                <span id="clockTime">9:41</span>
                <div class="dynamic-island"></div>
                <div class="status-icons">
                    <span>5G</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- App Header -->
            <div class="app-header">
                <div class="app-brand">
                    <div class="app-logo">📸</div>
                    <div class="app-title-group">
                        <h1>HEIC to JPG</h1>
                        <p>🔒 100% Private (On-Device)</p>
                    </div>
                </div>
                <button class="btn-clear" id="btnClear">Clear</button>
            </div>

            <!-- Scrollable Content -->
            <div class="app-content">
                <!-- Drop / Pick Zone -->
                <div class="drop-card" id="dropCard">
                    <input
                        type="file"
                        id="fileInput"
                        accept=".heic,.heif,image/heic,image/heif"
                        multiple
                    />
                    <div class="drop-icon">🖼️</div>
                    <div class="drop-title">Tap to Choose Photos</div>
                    <div class="drop-subtitle">
                        Supports iPhone .HEIC & .HEIF
                    </div>
                </div>

                <!-- iOS Settings Card -->
                <div class="settings-card">
                    <div class="settings-header">Output Quality</div>
                    <div class="segmented-control">
                        <button
                            class="segment-btn"
                            data-val="75"
                            id="segMedium"
                        >
                            75% (Small)
                        </button>
                        <button
                            class="segment-btn"
                            data-val="90"
                            id="segHigh"
                        >
                            90% (High)
                        </button>
                        <button
                            class="segment-btn active"
                            data-val="100"
                            id="segMax"
                        >
                            100% (Max)
                        </button>
                    </div>

                    <div class="slider-group">
                        <input
                            type="range"
                            id="qualitySlider"
                            min="10"
                            max="100"
                            value="100"
                        />
                        <span class="quality-badge" id="qualityBadge"
                            >100%</span
                        >
                    </div>

                    <div class="toggle-row">
                        <div>
                            <div class="toggle-label">Strip EXIF Metadata</div>
                            <div class="toggle-sub">
                                Remove GPS, camera & date info
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="stripToggle" />
                            <span class="slider-switch"></span>
                        </label>
                    </div>
                </div>

                <!-- Queue List -->
                <div class="queue-container" id="queueContainer" style="display: none;">
                    <div class="queue-header">
                        <span id="queueCount">0 Photos</span>
                        <span id="queueTotalSize">0 MB</span>
                    </div>
                    <div id="queueList" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                </div>
            </div>

            <!-- Sticky Bottom Action Bar -->
            <div class="app-bottom-bar">
                <div
                    class="progress-bar-container"
                    id="progressContainer"
                >
                    <div
                        class="progress-bar-fill"
                        id="progressBar"
                    ></div>
                </div>

                <button class="btn-main" id="btnAction" disabled>
                    Select Photos
                </button>
            </div>
        </div>

        <script>
            // Live Clock
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, "0");
                document.getElementById("clockTime").textContent = `${hours}:${minutes}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // Elements
            const fileInput = document.getElementById("fileInput");
            const dropCard = document.getElementById("dropCard");
            const queueContainer = document.getElementById("queueContainer");
            const queueList = document.getElementById("queueList");
            const queueCount = document.getElementById("queueCount");
            const queueTotalSize = document.getElementById("queueTotalSize");
            const btnClear = document.getElementById("btnClear");
            const btnAction = document.getElementById("btnAction");
            const qualitySlider = document.getElementById("qualitySlider");
            const qualityBadge = document.getElementById("qualityBadge");
            const stripToggle = document.getElementById("stripToggle");
            const progressContainer = document.getElementById("progressContainer");
            const progressBar = document.getElementById("progressBar");

            let queue = []; // Array of { id, file, name, size, status, blob, convertedBlob, url }
            let isConverting = false;
            let currentQuality = 1.0;

            // Segmented Quality Control
            document.querySelectorAll(".segment-btn").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    document
                        .querySelectorAll(".segment-btn")
                        .forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    const val = parseInt(btn.getAttribute("data-val"), 10);
                    qualitySlider.value = val;
                    qualityBadge.textContent = `${val}%`;
                    currentQuality = val / 100;
                });
            });

            qualitySlider.addEventListener("input", (e) => {
                const val = parseInt(e.target.value, 10);
                qualityBadge.textContent = `${val}%`;
                currentQuality = val / 100;
                document
                    .querySelectorAll(".segment-btn")
                    .forEach((b) => b.classList.remove("active"));
            });

            function formatSize(bytes) {
                if (bytes < 1024 * 1024)
                    return (bytes / 1024).toFixed(1) + " KB";
                return (bytes / (1024 * 1024)).toFixed(1) + " MB";
            }

            function handleFiles(files) {
                const validFiles = Array.from(files).filter(
                    (f) =>
                        f.name.toLowerCase().endsWith(".heic") ||
                        f.name.toLowerCase().endsWith(".heif"),
                );

                if (!validFiles.length) {
                    alert("Please select .HEIC or .HEIF photos");
                    return;
                }

                validFiles.forEach((file) => {
                    queue.push({
                        id: Math.random().toString(36).substr(2, 9),
                        file: file,
                        name: file.name,
                        size: file.size,
                        status: "waiting", // waiting | converting | done | error
                        convertedBlob: null,
                        url: null,
                    });
                });

                renderQueue();
            }

            fileInput.addEventListener("change", (e) => {
                handleFiles(e.target.files);
                fileInput.value = "";
            });

            // Drag & Drop
            dropCard.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropCard.classList.add("dragover");
            });
            dropCard.addEventListener("dragleave", () =>
                dropCard.classList.remove("dragover"),
            );
            dropCard.addEventListener("drop", (e) => {
                e.preventDefault();
                dropCard.classList.remove("dragover");
                handleFiles(e.dataTransfer.files);
            });

            // Clear All
            btnClear.addEventListener("click", () => {
                queue.forEach((item) => {
                    if (item.url) URL.revokeObjectURL(item.url);
                });
                queue = [];
                renderQueue();
            });

            function renderQueue() {
                if (queue.length === 0) {
                    queueContainer.style.display = "none";
                    btnClear.style.display = "none";
                    dropCard.classList.remove("has-files");
                    btnAction.disabled = true;
                    btnAction.textContent = "Select Photos";
                    btnAction.className = "btn-main";
                    progressContainer.style.display = "none";
                    return;
                }

                queueContainer.style.display = "flex";
                btnClear.style.display = "block";
                dropCard.classList.add("has-files");

                const totalBytes = queue.reduce((sum, item) => sum + item.size, 0);
                queueCount.textContent = `${queue.length} Photo${queue.length > 1 ? "s" : ""}`;
                queueTotalSize.textContent = formatSize(totalBytes);

                queueList.innerHTML = "";
                const allDone = queue.length > 0 && queue.every((i) => i.status === "done");

                queue.forEach((item, index) => {
                    const el = document.createElement("div");
                    el.className = "queue-item";

                    let statusBadge = `<span class="status-badge">Ready</span>`;
                    if (item.status === "converting") {
                        statusBadge = `<span class="status-badge converting"><span class="spinner-mini"></span> Converting</span>`;
                    } else if (item.status === "done") {
                        statusBadge = `<span class="status-badge done">✓ JPG</span>`;
                    } else if (item.status === "error") {
                        statusBadge = `<span class="status-badge error">✕ Failed</span>`;
                    }

                    const safeName = item.name.replace(/\.[^/.]+$/, "") + ".jpg";

                    el.innerHTML = `
                        <div class="item-thumb">${item.status === "done" ? "✅" : "🖼️"}</div>
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-size">${formatSize(item.size)} &bull; ${statusBadge}</div>
                        </div>
                        <div class="item-action">
                            ${
                                item.status === "done" && item.url
                                    ? `<a class="btn-item-dl" style="display:block;" href="${item.url}" download="${safeName}">Save</a>`
                                    : ""
                            }
                            ${
                                !isConverting
                                    ? `<button class="btn-remove" data-id="${item.id}">&times;</button>`
                                    : ""
                            }
                        </div>
                    `;

                    el.querySelector(".btn-remove")?.addEventListener("click", () => {
                        if (item.url) URL.revokeObjectURL(item.url);
                        queue = queue.filter((q) => q.id !== item.id);
                        renderQueue();
                    });

                    queueList.appendChild(el);
                });

                if (allDone) {
                    btnAction.disabled = false;
                    btnAction.className = "btn-main success-state";
                    btnAction.innerHTML =
                        queue.length === 1
                            ? `💾 Download JPG`
                            : `💾 Download ZIP (${queue.length} Photos)`;
                } else if (!isConverting) {
                    btnAction.disabled = false;
                    btnAction.className = "btn-main";
                    btnAction.innerHTML = `⚡ Convert ${queue.length} Photo${queue.length > 1 ? "s" : ""}`;
                }
            }

            // Client-Side Conversion via WebAssembly
            async function startConversion() {
                if (isConverting || !queue.length) return;

                isConverting = true;
                btnAction.disabled = true;
                progressContainer.style.display = "block";
                progressBar.style.width = "0%";

                let convertedCount = 0;

                for (let i = 0; i < queue.length; i++) {
                    const item = queue[i];
                    if (item.status === "done") {
                        convertedCount++;
                        continue;
                    }

                    item.status = "converting";
                    renderQueue();
                    btnAction.innerHTML = `<span class="spinner-mini"></span> Converting ${i + 1} of ${queue.length}...`;

                    try {
                        // Invoke WebAssembly heic2any
                        const result = await heic2any({
                            blob: item.file,
                            toType: "image/jpeg",
                            quality: currentQuality,
                        });

                        // heic2any returns single Blob or array of Blobs
                        const outputBlob = Array.isArray(result) ? result[0] : result;
                        item.convertedBlob = outputBlob;
                        item.url = URL.createObjectURL(outputBlob);
                        item.status = "done";
                        convertedCount++;
                    } catch (err) {
                        console.error("HEIC conversion error on", item.name, err);
                        item.status = "error";
                    }

                    progressBar.style.width = `${Math.round(((i + 1) / queue.length) * 100)}%`;
                    renderQueue();
                }

                isConverting = false;
                renderQueue();
            }

            // Download Handler
            async function handleDownloadAll() {
                const readyItems = queue.filter((i) => i.status === "done" && i.convertedBlob);
                if (!readyItems.length) return;

                if (readyItems.length === 1) {
                    // Single download
                    const item = readyItems[0];
                    const safeName = item.name.replace(/\.[^/.]+$/, "") + ".jpg";
                    const a = document.createElement("a");
                    a.href = item.url;
                    a.download = safeName;
                    a.click();
                } else {
                    // Multi-file ZIP download via JSZip
                    btnAction.disabled = true;
                    btnAction.innerHTML = `<span class="spinner-mini"></span> Creating ZIP...`;

                    const zip = new JSZip();
                    const usedNames = new Set();

                    readyItems.forEach((item) => {
                        let stem = item.name.replace(/\.[^/.]+$/, "");
                        let finalName = `${stem}.jpg`;
                        let count = 1;
                        while (usedNames.has(finalName)) {
                            finalName = `${stem} (${count}).jpg`;
                            count++;
                        }
                        usedNames.add(finalName);
                        zip.file(finalName, item.convertedBlob);
                    });

                    const zipBlob = await zip.generateAsync({ type: "blob" });
                    const zipUrl = URL.createObjectURL(zipBlob);
                    const a = document.createElement("a");
                    a.href = zipUrl;
                    a.download = "converted-photos.zip";
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(zipUrl), 2000);

                    btnAction.disabled = false;
                    btnAction.innerHTML = `💾 Download ZIP (${readyItems.length} Photos)`;
                }
            }

            btnAction.addEventListener("click", () => {
                const allDone = queue.length > 0 && queue.every((i) => i.status === "done");
                if (allDone) {
                    handleDownloadAll();
                } else {
                    startConversion();
                }
            });
        </script>
    </body>
</html>
