[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heic2jpg"
version = "1.5.4"
description = "HEIC to JPG converter utility and web app"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "Pillow>=10.0.0",
    "pillow-heif>=0.13.0",
]

[project.scripts]
heic2jpg = "converter:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Repository = "https://github.com/athomft/HEIC2JPG"

[tool.setuptools]
py-modules = ["converter"]


